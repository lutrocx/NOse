<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Defensa por Rondas</title>
<style>
  html,body{margin:0;height:100%;background:#14090a;color:#eee;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
  canvas{background:#222;max-width:100vw;max-height:100vh;image-rendering:pixelated;border:2px solid #5a2a22}
</style>
</head>
<body>
<canvas id="c" width="960" height="640"></canvas>
<script>
/* ============ CONFIGURACIÓN DE SPRITES ============
   Estructura de carpetas:
     juego.html
     sprites/          <- pon aquí todos tus PNG
   Si un archivo no existe, el juego dibuja una figura de respaldo. */
const SPRITE_DIR = 'sprites/';
const SPRITE_FILES = {
  player:   'player.sprite.png',               // jugador
  enemy0:   'enemigo.png',                     // enemigo normal
  enemy1:   'enemig2mejorado.png',             // enemigo rápido
  enemy2:   'enemig3mejorado.png',             // enemigo tanque
  objeto:   'objeto.png',                      // estructura (cobertura)
  riel:     'conexion entre estructuras.png',  // riel que conecta estructuras
  foot:     'foot.png',                        // pollo: +30% vida
  bala:     'punto.png',                       // proyectil del jugador
  balaEnemigo: 'proyectiles de enemigos.png',  // proyectil enemigo
  fondo:    'mapa.png',                        // fondo del mapa
  explo1:   'spriteexplosion1.png',            // animación de explosión (3 cuadros)
  explo2:   'spriteexplosion2.png',
  explo3:   'spriteexplosion3.png'
};
const SOUND_FILES = {
  playerShot: 'disparo.wav',
  enemyShot: 'disparo_enemigo.wav',
  levelUp: 'nivel.wav',
  build: 'construir.wav',
  collapse: 'derrumbe.wav',
  heal: 'curar.wav',
  damage: 'dano.wav',
  explosion: 'explosion.wav'
};
const RAIL_IS_VERTICAL = true;   // tu riel está dibujado de arriba a abajo
const PLAYER_ROTATES  = false;   // true = el sprite gira hacia el mouse

const W = 960, H = 640, CELL = 40, COLS = W / CELL, ROWS = H / CELL;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false; // pixel art nítido
let soundEnabled = true;
const MUSIC_FILES = {
  between: 'calma.wav',
  wave: 'combate.wav',
  over: 'gameover.wav'
};
const music = new Audio();
music.preload = 'auto';
music.volume = 0.25;
let currentMusic = '';
music.addEventListener('error', () => {
  console.warn(`No se pudo cargar la pista de música: ${music.src}`);
});
function updateMusic() {
  if (!soundEnabled) {
    music.pause();
    return;
  }
  const track = MUSIC_FILES[state];
  if (!track) return;
  const source = 'musica/' + track;
  if (currentMusic !== source) {
    currentMusic = source;
    music.src = source;
    music.loop = state !== 'over';
    music.load();
  }
  if (music.paused && !music.ended) {
    const playback = music.play();
    if (playback) playback.catch(error => {
      if (error.name !== 'NotAllowedError') console.warn('No se pudo reproducir la música.', error);
    });
  }
}
const SFX = {};
for (const [name, file] of Object.entries(SOUND_FILES)) {
  const channels = Array.from({ length: 3 }, () => {
    const audio = new Audio('sonidos/' + file);
    audio.preload = 'auto';
    audio.volume = 0.45;
    return audio;
  });
  SFX[name] = { channels, next: 0, lastPlayed: -Infinity };
}
function playSound(name, minInterval = 0) {
  if (!soundEnabled) return;
  const sound = SFX[name];
  if (!sound) return;
  const now = performance.now();
  if (now - sound.lastPlayed < minInterval) return;
  sound.lastPlayed = now;
  const audio = sound.channels[sound.next];
  sound.next = (sound.next + 1) % sound.channels.length;
  audio.currentTime = 0;
  const playback = audio.play();
  if (playback) playback.catch(error => {
    if (error.name !== 'NotAllowedError') console.warn(`No se pudo reproducir el sonido "${name}".`, error);
  });
}

const IMG = {};
for (const k in SPRITE_FILES) {
  const im = new Image();
  im.onload = () => im.ok = true;
  im.src = SPRITE_DIR + SPRITE_FILES[k];
  IMG[k] = im;
}
let effects = []; // explosiones
const has = k => IMG[k] && IMG[k].ok;

/* ============ ESTADO ============ */
let player, enemies, bullets, structures, pickups, particles;
let round, spawnQueue, spawnTimer, state, between, gameTime, scrap, kills, flash, lastEnemyLevel;
const keys = {}, mouse = { x: W / 2, y: H / 2, down: false };
const STRUCT_COST = 10, STRUCT_HP = 120, LEVEL_EVERY = 25; // segundos por nivel de enemigo

const TYPES = [
  { hp: 30, speed: 60, fire: 1.8, range: 320, dmg: 8,  bspeed: 230, r: 14, color: '#d4572b', score: 3 },
  { hp: 20, speed: 105, fire: 2.4, range: 240, dmg: 6,  bspeed: 260, r: 11, color: '#e8c33a', score: 4 },
  { hp: 90, speed: 42, fire: 1.3, range: 360, dmg: 16, bspeed: 190, r: 20, color: '#7a2a8c', score: 8 }
];

function reset() {
  player = { x: W / 2, y: H / 2, r: 14, hp: 100, max: 100, cd: 0, speed: 190, ang: 0 };
  enemies = []; bullets = []; pickups = []; particles = []; effects = [];
  structures = new Map();
  round = 0; scrap = 60; kills = 0; gameTime = 0; flash = 0;
  state = 'between'; between = 6; spawnQueue = 0; spawnTimer = 0;
  lastEnemyLevel = enemyLevel();
  // estructuras iniciales conectadas
  for (let i = -2; i <= 2; i++) addStruct(COLS / 2 + i, ROWS / 2 - 4);
}
const key = (cx, cy) => cx + ',' + cy;
function addStruct(cx, cy) { structures.set(key(cx, cy), { cx, cy, hp: STRUCT_HP, max: STRUCT_HP }); }
const enemyLevel = () => 1 + Math.floor(gameTime / LEVEL_EVERY);
const mult = lv => 1 + 0.28 * (lv - 1);

function startRound() {
  round++; state = 'wave';
  spawnQueue = 6 + round * 4; spawnTimer = 0;
}
function spawnEnemy() {
  let t = 0; const r = Math.random();
  if (round >= 3 && r < 0.2) t = 2; else if (round >= 2 && r < 0.5) t = 1;
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * W; y = -20; }
  else if (side === 1) { x = Math.random() * W; y = H + 20; }
  else if (side === 2) { x = -20; y = Math.random() * H; }
  else { x = W + 20; y = Math.random() * H; }
  const lv = enemyLevel(), T = TYPES[t];
  const max = T.hp * mult(lv);
  enemies.push({ x, y, t, lv, hp: max, max, cd: Math.random() * T.fire, r: T.r, lvFlash: 0 });
}

/* ============ COLISIONES ============ */
function resolve(e) {
  const cx0 = Math.floor((e.x - e.r) / CELL), cx1 = Math.floor((e.x + e.r) / CELL);
  const cy0 = Math.floor((e.y - e.r) / CELL), cy1 = Math.floor((e.y + e.r) / CELL);
  for (let cx = cx0; cx <= cx1; cx++) for (let cy = cy0; cy <= cy1; cy++) {
    if (!structures.has(key(cx, cy))) continue;
    const rx = cx * CELL, ry = cy * CELL;
    const nx = Math.max(rx, Math.min(e.x, rx + CELL)), ny = Math.max(ry, Math.min(e.y, ry + CELL));
    let dx = e.x - nx, dy = e.y - ny, d = Math.hypot(dx, dy);
    if (d < e.r) {
      if (d === 0) { dx = e.x - (rx + CELL / 2); dy = e.y - (ry + CELL / 2); d = Math.hypot(dx, dy) || 1; }
      e.x += dx / d * (e.r - d); e.y += dy / d * (e.r - d);
    }
  }
  e.x = Math.max(e.r, Math.min(W - e.r, e.x));
  e.y = Math.max(e.r, Math.min(H - e.r, e.y));
}

function shoot(from, x, y, ang, dmg, speed, r) {
  bullets.push({ from, x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, dmg, r, life: 3 });
  playSound(from === 'p' ? 'playerShot' : 'enemyShot');
}
function burst(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = 40 + Math.random() * 120;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.3, color });
  }
}

/* ============ ACTUALIZACIÓN ============ */
function update(dt) {
  if (state === 'over') return;
  gameTime += dt;
  flash = Math.max(0, flash - dt);
  const currentLevel = enemyLevel();
  if (currentLevel > lastEnemyLevel) {
    lastEnemyLevel = currentLevel;
    playSound('levelUp');
  }

  // jugador
  let mx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  let my = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
  const m = Math.hypot(mx, my) || 1;
  player.x += mx / m * player.speed * dt; player.y += my / m * player.speed * dt;
  resolve(player);
  player.ang = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  player.cd -= dt;
  if ((mouse.down || keys[' ']) && player.cd <= 0) {
    player.cd = 0.17;
    shoot('p', player.x, player.y, player.ang, 14, 520, 4);
  }

  // rondas
  if (state === 'between') {
    between -= dt;
    if (between <= 0) startRound();
  } else if (state === 'wave') {
    spawnTimer -= dt;
    if (spawnQueue > 0 && spawnTimer <= 0) {
      spawnEnemy(); spawnQueue--; spawnTimer = Math.max(0.35, 1.1 - round * 0.05);
    }
    if (spawnQueue === 0 && enemies.length === 0) {
      state = 'between'; between = 9; scrap += 20 + round * 5;
    }
  }

  // enemigos
  const gl = enemyLevel();
  for (const e of enemies) {
    const T = TYPES[e.t];
    if (e.lv < gl) { // suben de nivel con el tiempo
      e.lv = gl; const nm = T.hp * mult(gl); e.hp += nm - e.max; e.max = nm; e.lvFlash = 1;
      burst(e.x, e.y, '#fff', 6);
    }
    e.lvFlash = Math.max(0, e.lvFlash - dt);
    const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy) || 1;
    const sp = T.speed * (1 + 0.06 * (e.lv - 1));
    if (d > T.range * 0.6) { e.x += dx / d * sp * dt; e.y += dy / d * sp * dt; }
    else { e.x += -dy / d * sp * 0.4 * dt; e.y += dx / d * sp * 0.4 * dt; } // rodea
    resolve(e);
    e.cd -= dt;
    if (e.cd <= 0 && d < T.range) {
      e.cd = T.fire / (1 + 0.08 * (e.lv - 1));
      shoot('e', e.x, e.y, Math.atan2(dy, dx), T.dmg * mult(e.lv), T.bspeed, e.t === 2 ? 7 : 5);
    }
    if (d < e.r + player.r) { hurt(20 * dt); }
  }

  // balas
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) b.life = 0;
    if (b.from === 'e') {
      const s = structures.get(key(Math.floor(b.x / CELL), Math.floor(b.y / CELL)));
      if (s) { s.hp -= b.dmg; b.life = 0; burst(b.x, b.y, '#8a8a8a', 4); if (s.hp <= 0) { structures.delete(key(s.cx, s.cy)); playSound('collapse'); } continue; }
      if (Math.hypot(b.x - player.x, b.y - player.y) < player.r + b.r) { hurt(b.dmg); b.life = 0; burst(b.x, b.y, '#ff4466', 5); }
    } else {
      for (const e of enemies) {
        if (e.hp > 0 && Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.r) {
          e.hp -= b.dmg; b.life = 0; burst(b.x, b.y, '#ffd', 3);
          if (e.hp <= 0) {
            kills++; scrap += TYPES[e.t].score; burst(e.x, e.y, TYPES[e.t].color, 14);
            playSound('explosion');
            effects.push({ x: e.x, y: e.y, t: 0, size: e.r * 3.2 });
            if (Math.random() < 0.18) pickups.push({ x: e.x, y: e.y });
          }
          break;
        }
      }
    }
  }
  bullets = bullets.filter(b => b.life > 0);
  enemies = enemies.filter(e => e.hp > 0);

  // pickups (foot = +30% vida)
  for (const p of pickups) {
    if (Math.hypot(p.x - player.x, p.y - player.y) < 24) {
      player.hp = Math.min(player.max, player.hp + player.max * 0.30); p.taken = true;
      playSound('heal');
      burst(p.x, p.y, '#6f6', 10);
    }
  }
  pickups = pickups.filter(p => !p.taken);

  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const f of effects) f.t += dt;
  effects = effects.filter(f => f.t < 0.36);
  updateMusic();
}
function hurt(d) {
  player.hp -= d; flash = 0.15;
  playSound('damage', 250);
  if (player.hp <= 0) { player.hp = 0; state = 'over'; }
}

/* ============ DIBUJO ============ */
function drawRail(x1, y1, x2, y2) {
  const len = Math.hypot(x2 - x1, y2 - y1), ang = Math.atan2(y2 - y1, x2 - x1);
  ctx.save(); ctx.translate(x1, y1); ctx.rotate(ang);
  if (has('riel')) {
    if (RAIL_IS_VERTICAL) { ctx.rotate(-Math.PI / 2); ctx.drawImage(IMG.riel, -CELL / 4, 0, CELL / 2, len); }
    else ctx.drawImage(IMG.riel, 0, -CELL / 4, len, CELL / 2);
  } else {
    // riel generado: durmientes + dos rieles
    ctx.fillStyle = '#4a2f1d';
    for (let i = 4; i < len; i += 10) ctx.fillRect(i - 2, -9, 5, 18);
    ctx.fillStyle = '#b9b9c2';
    ctx.fillRect(0, -6, len, 3); ctx.fillRect(0, 3, len, 3);
    ctx.fillStyle = '#6e6e78';
    ctx.fillRect(0, -3, len, 1); ctx.fillRect(0, 6, len, 1);
  }
  ctx.restore();
}
function drawStruct(s) {
  const x = s.cx * CELL, y = s.cy * CELL;
  if (has('objeto')) ctx.drawImage(IMG.objeto, x + 2, y + 2, CELL - 4, CELL - 4);
  else {
    ctx.fillStyle = '#2f5fd0'; ctx.fillRect(x + 3, y + 3, CELL - 6, CELL - 6);
    ctx.fillStyle = '#1b3a8c'; ctx.fillRect(x + 8, y + 8, CELL - 16, CELL - 16);
  }
  if (s.hp < s.max) {
    ctx.fillStyle = '#000a'; ctx.fillRect(x + 4, y + CELL - 7, CELL - 8, 4);
    ctx.fillStyle = '#5f5'; ctx.fillRect(x + 4, y + CELL - 7, (CELL - 8) * s.hp / s.max, 4);
  }
}
function draw() {
  // fondo
  if (has('fondo')) ctx.drawImage(IMG.fondo, 0, 0, W, H);
  else {
    ctx.fillStyle = '#3b2a26'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#ffffff0d'; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += CELL) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += CELL) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  }
  // vista previa de construcción
  const hx = Math.floor(mouse.x / CELL), hy = Math.floor(mouse.y / CELL);
  ctx.fillStyle = structures.has(key(hx, hy)) ? '#f444' : '#4f48';
  ctx.fillRect(hx * CELL, hy * CELL, CELL, CELL);

  // rieles (conectan estructuras vecinas)
  for (const s of structures.values()) {
    const cx = s.cx * CELL + CELL / 2, cy = s.cy * CELL + CELL / 2;
    if (structures.has(key(s.cx + 1, s.cy))) drawRail(cx, cy, cx + CELL, cy);
    if (structures.has(key(s.cx, s.cy + 1))) drawRail(cx, cy, cx, cy + CELL);
  }
  for (const s of structures.values()) drawStruct(s);

  // pickups
  for (const p of pickups) {
    const bob = Math.sin(gameTime * 6) * 2;
    if (has('foot')) ctx.drawImage(IMG.foot, p.x - 14, p.y - 14 + bob, 28, 28);
    else {
      ctx.fillStyle = '#c47a2a'; ctx.beginPath(); ctx.arc(p.x, p.y + bob, 10, 0, 7); ctx.fill();
      ctx.fillStyle = '#eee'; ctx.fillRect(p.x + 6, p.y + bob + 4, 8, 4);
    }
    ctx.fillStyle = '#7f7'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('+30%', p.x, p.y - 18);
  }

  // enemigos
  for (const e of enemies) {
    const T = TYPES[e.t], k = 'enemy' + e.t;
    if (has(k)) ctx.drawImage(IMG[k], e.x - e.r - 4, e.y - e.r - 4, e.r * 2 + 8, e.r * 2 + 8);
    else {
      ctx.fillStyle = T.color; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 7); ctx.fill();
      ctx.fillStyle = '#000a'; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.45, 0, 7); ctx.fill();
    }
    if (e.lvFlash > 0) { ctx.strokeStyle = `rgba(255,255,255,${e.lvFlash})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 8 * (1 - e.lvFlash) + 4, 0, 7); ctx.stroke(); }
    ctx.fillStyle = '#000a'; ctx.fillRect(e.x - 16, e.y - e.r - 12, 32, 4);
    ctx.fillStyle = '#e44'; ctx.fillRect(e.x - 16, e.y - e.r - 12, 32 * e.hp / e.max, 4);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Nv' + e.lv, e.x, e.y - e.r - 15);
  }

  // jugador
  ctx.save(); ctx.translate(player.x, player.y);
  if (has('player')) {
    if (PLAYER_ROTATES) ctx.rotate(player.ang);
    ctx.drawImage(IMG.player, -20, -20, 40, 40);
    ctx.restore();
    // línea de puntería corta para saber hacia dónde disparas
    ctx.strokeStyle = '#ffffff66'; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(player.x + Math.cos(player.ang) * 24, player.y + Math.sin(player.ang) * 24);
    ctx.lineTo(player.x + Math.cos(player.ang) * 34, player.y + Math.sin(player.ang) * 34); ctx.stroke();
  } else {
    ctx.rotate(player.ang);
    ctx.fillStyle = '#e0508c'; ctx.beginPath(); ctx.arc(0, 0, player.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#9ce'; ctx.fillRect(6, -3, 16, 6);
    ctx.restore();
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,0,0,${flash * 2})`; ctx.fillRect(0, 0, W, H); }

  // balas
  for (const b of bullets) {
    const bk = b.from === 'p' ? 'bala' : 'balaEnemigo';
    if (has(bk)) { const s = b.r * 4 + 6; ctx.drawImage(IMG[bk], b.x - s / 2, b.y - s / 2, s, s); }
    else { ctx.fillStyle = b.from === 'p' ? '#ffe45c' : '#ff5a7a'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); }
  }
  for (const f of effects) { // explosión: 3 cuadros
    const k = 'explo' + (1 + Math.min(2, Math.floor(f.t / 0.12)));
    if (has(k)) ctx.drawImage(IMG[k], f.x - f.size / 2, f.y - f.size / 2, f.size, f.size);
  }
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3); }
  ctx.globalAlpha = 1;

  // HUD
  ctx.textAlign = 'left'; ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#000a'; ctx.fillRect(10, 10, 200, 16);
  ctx.fillStyle = '#4c4'; ctx.fillRect(10, 10, 200 * player.hp / player.max, 16);
  ctx.fillStyle = '#fff'; ctx.fillText(`Vida ${Math.ceil(player.hp)}/${player.max}`, 14, 23);
  ctx.fillText(`Ronda ${round}   Nivel enemigos ${enemyLevel()}   Chatarra ${scrap}   Bajas ${kills}`, 10, 46);
  const nextLv = LEVEL_EVERY - (gameTime % LEVEL_EVERY);
  ctx.font = '12px sans-serif'; ctx.fillStyle = '#ddd';
  ctx.fillText(`Siguiente nivel en ${nextLv.toFixed(0)}s`, 10, 62);
  ctx.textAlign = 'right';
  ctx.fillText(`WASD mover · Clic disparar · Clic derecho: construir (10) · Shift+clic derecho: quitar · M: audio ${soundEnabled ? 'ON' : 'OFF'}`, W - 10, H - 10);

  ctx.textAlign = 'center';
  if (state === 'between') {
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px sans-serif';
    ctx.fillText(round === 0 ? '¡Prepara tus defensas!' : `Ronda ${round} superada`, W / 2, 80);
    ctx.font = '16px sans-serif';
    ctx.fillText(`Ronda ${round + 1} en ${Math.ceil(between)}s (Enter para saltar)`, W / 2, 106);
  }
  if (state === 'over') {
    ctx.fillStyle = '#000b'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 44px sans-serif'; ctx.fillText('GAME OVER', W / 2, H / 2 - 20);
    ctx.font = '18px sans-serif'; ctx.fillText(`Llegaste a la ronda ${round} · ${kills} bajas · Pulsa R para reiniciar`, W / 2, H / 2 + 20);
  }
}

/* ============ ENTRADA ============ */
addEventListener('keydown', e => {
  updateMusic();
  const k = e.key.toLowerCase(); keys[k] = true;
  if (k === ' ') e.preventDefault();
  if (k === 'enter' && state === 'between') between = 0;
  if (k === 'r' && state === 'over') reset();
  if (k === 'm' && !e.repeat) {
    soundEnabled = !soundEnabled;
    updateMusic();
  }
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
function setMouse(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * W / r.width; mouse.y = (e.clientY - r.top) * H / r.height;
}
cv.addEventListener('mousemove', setMouse);
cv.addEventListener('mousedown', e => {
  updateMusic();
  setMouse(e);
  if (e.button === 0) mouse.down = true;
  else if (e.button === 2) {
    const cx = Math.floor(mouse.x / CELL), cy = Math.floor(mouse.y / CELL), k = key(cx, cy);
    if (e.shiftKey) { if (structures.has(k)) { structures.delete(k); scrap += Math.floor(STRUCT_COST / 2); playSound('collapse'); } }
    else if (!structures.has(k) && scrap >= STRUCT_COST) {
      const rx = cx * CELL, ry = cy * CELL;
      const free = [player, ...enemies].every(o => Math.hypot(o.x - (rx + CELL / 2), o.y - (ry + CELL / 2)) > o.r + CELL * 0.7);
      if (free) { addStruct(cx, cy); scrap -= STRUCT_COST; playSound('build'); }
    }
  }
});
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ============ BUCLE ============ */
let last = performance.now();
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt); draw(); requestAnimationFrame(loop);
}
reset(); requestAnimationFrame(loop);
</script>
